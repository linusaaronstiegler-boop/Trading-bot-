name: systembuch-bot
on:
  schedule:
    # K6 (15.10.2026): Entscheidung 15:45 ET. Der Lauf startet früh (Cron-Verzug bei GitHub bis 15 Min) und wartet im Bot bis 15:45.
    - cron: '28 19 * * 1-5'   # 15:28 New York bei US-Sommerzeit (EDT)
    - cron: '28 20 * * 1-5'   # 15:28 New York bei US-Winterzeit (EST); der jeweils falsche Lauf beendet sich sofort ("kein Fenster")
    - cron: '40 19 * * 1-5'   # Nachläufer 15:40 EDT, falls der erste Lauf verzögert/ausgefallen ist (`letzter_lauf` verhindert Doppelhandel)
    - cron: '40 20 * * 1-5'   # Nachläufer 15:40 EST
    # Halbtage (Schluss 13:00 ET) für jedes Jahr: Tag nach Thanksgiving und Heiligabend (EST), 3. Juli (EDT).
    # An normalen Tagen endet dieser Lauf sofort mit "kein Fenster" (keine Datei geändert, kein Commit).
    - cron: '28 17 * 11,12 1-5'   # 12:28 ET (EST)
    - cron: '40 17 * 11,12 1-5'   # Nachläufer 12:40 ET
    - cron: '28 16 3 7 *'         # 12:28 ET (EDT), 3. Juli
    - cron: '40 16 3 7 *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'dry = nur rechnen (auch außerhalb des Fensters), live = handeln (nur im Fenster 10–30 Min vor Schluss)'
        default: 'dry'
        type: choice
        options: [dry, live]
permissions:
  contents: write
  issues: write
concurrency:
  group: systembuch-bot
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # aktueller Stand beim Jobstart, nicht der beim Auslösen (Nachläufer wartet in der Warteschlange)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modus }}" = "dry" ]; then
            python3 systembuch_bot.py --dry --force
          else
            python3 systembuch_bot.py
          fi
      - name: Zustand als Artifact (Review 5.6, vor dem Commit, also immer der eigene Stand)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zustand-${{ github.run_id }}
          path: |
            state.json
            journal.csv
            equity.csv
            STATUS.md
            STATUS-dry.md
            log.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "systembuch-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in state.json journal.csv equity.csv STATUS.md STATUS-dry.md log.txt; do [ -f "$f" ] && git add -f -- "$f"; done
          [ -d berichte ] && git add -f -- berichte
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lauf $(date -u +%F)"
          # Review v2 (5.6/6.7): Scheitert der Push dreimal (Konflikt, Branch-Schutz), wird der Lauf rot → Issue-Alarm.
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Push dreimal gescheitert – der Stand dieses Laufs liegt im Artifact zustand-$GITHUB_RUN_ID" >&2
          exit 1
      - name: Alarm als GitHub-Issue (roter Lauf)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f STATUS.md ] && head -c 5000 STATUS.md
          } > alarm.md
          gh issue create --repo "${{ github.repository }}" --title "Systembuch-Bot: roter Lauf $(date -u +%F)" --body-file alarm.md
